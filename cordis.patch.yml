- insert:
    - id: dsn-finance
      name: dsn-finance
      config:
        cacheTtlSec: 300
        requestGapMs: 3000
        httpTimeoutMs: 30000
        probeReportPath: data/probe-report.json
        portfolioPath: data/portfolio.json

# Route the web search seam through this plugin's meta-search provider.
- id: web
  config:
    searchProvider: dsn-web-search
