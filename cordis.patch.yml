- insert:
    - id: dsh-finance
      name: dsh-finance
      config:
        cacheTtlSec: 300
        requestGapMs: 3000
        httpTimeoutMs: 30000
        # 数据文件位置由 dataDir 决定（默认 <包目录>/data）；需要按 profile 隔离时
        # 在 profile 层覆盖 dataDir，或显式给出绝对的 portfolioPath / probeReportPath。

# Route the web search seam through this plugin's meta-search provider.
- id: web
  config:
    searchProvider: dsh-web-search
